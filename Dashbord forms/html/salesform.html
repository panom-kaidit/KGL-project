<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Form</title>
    <link rel="stylesheet" href="/Dashbord forms/CSS/salesform.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <div class="login-container">
      <!-- Header -->
      <div class="form-header">
        <img src="/images/logo/karibu icon.png" alt="Karibu icon" />
        <h1>Karibu</h1>
        <h2>Sales Form</h2>
        <p>Please enter sale details</p>
      </div>

      <!-- Form -->
      <form class="form-box">
        <!-- Sale Info -->
        <div class="form-group">
          <label for="sale-id">Sale ID / Receipt Number</label>
          <input
            class="input"
            type="text"
            id="sale-id"
            placeholder="Receipt number"
            required
          />
        </div>

        <div class="form-group">
          <label for="sale-date">Sale Date</label>
          <input class="input" type="date" id="sale-date" required />
        </div>

        <!-- Customer Info -->
        <div class="form-group">
          <label for="customer-name">Customer Name</label>
          <input
            class="input"
            type="text"
            id="customer-name"
            placeholder="Customer name"
          />
        </div>

        <div class="form-group">
          <label for="customer-phone">Customer Phone</label>
          <input
            class="input"
            type="tel"
            id="customer-phone"
            placeholder="Phone number"
          />
        </div>

        <!-- ================= PRODUCT INFO ================= -->
        <div class="form-group">
          <label for="product-name">Product Name</label>
          <select class="input" id="product-name">
            <option value="">-- Select Product --</option>
            <option value="Maize grain">Maize grain</option>
            <option value="Beans">Beans</option>
            <option value="Cow peas">Cow peas</option>
            <option value="G-nuts">G-nuts</option>
            <option value="Soybeans">Soybeans</option>
          </select>
        </div>

        <div class="form-group">
          <label for="product-category">Product Category</label>
          <input
            class="input"
            type="text"
            id="product-category"
            value="Cereal"
            readonly
          />
        </div>

        <div class="form-group">
          <label for="quantity">Quantity Sold</label>
          <input class="input" type="number" id="quantity" />
        </div>

        <div class="form-group">
          <label for="unit-price">Unit Price</label>
          <input class="input" type="number" step="0.01" id="unit-price" />
        </div>

        <!-- ADD PRODUCT BUTTON -->
        <div class="form-group" style="grid-column: span 2">
          <button class="add-btn" type="button" onclick="addProduct()">
            <i class="fa-solid fa-cart-plus"></i>
            <span>Add Product</span>
          </button>
        </div>

        <!-- PRODUCT LIST -->
        <div class="form-group" style="grid-column: span 2">
          <table width="100%" border="1" cellpadding="8" cellspacing="0">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="product-list">
              <!-- Products will appear here -->
            </tbody>
            <tfoot>
                <!-- where the total amount to be shown -->
                <tr>
                    <td colspan="4"><strong>Grand Total</strong></td>
                    <td colspan="2"><strong id="grand-total">0</strong></td>
                </tr>
            </tfoot>
          </table>
        </div>

        <!-- Payment Info -->
        <div class="form-group">
          <label>Payment Method</label>
          <div class="remember">
            <label><input type="radio" name="payment" /> Cash</label>
            <label><input type="radio" name="payment" /> Mobile Money</label>
            <label><input type="radio" name="payment" /> Card</label>
          </div>
        </div>

        <!-- Payment Status -->
        <div class="form-group">
          <label>Payment Status</label>
          <div class="remember">
            <label>
              <input type="radio" name="payment_status" value="paid" /> Paid
            </label>
            <label>
              <input type="radio" name="payment_status" value="pending" />
              Pending
            </label>
            <label>
              <input type="radio" name="payment_status" value="partial" />
              Partial
            </label>
          </div>
        </div>
        <!-- Submit -->
        <div class="submit-btn">
          <button type="submit">Submit Sale</button>
        </div>
      </form>
    </div>
    <script>
      let products = [];

      function addProduct() {
        const name = document.getElementById("product-name").value;
        const category = document.getElementById("product-category").value;
        const qty = document.getElementById("quantity").value;
        const price = document.getElementById("unit-price").value;

        if (!name || !qty || !price) {
          alert("Please enter product name, quantity and price");
          return;
        }

        const total = qty * price;

        products.push({ name, category, qty, price, total });

        renderProducts();

        // Clear inputs
        document.getElementById("product-name").value = "";
        document.getElementById("product-category").value = "Cereal";
        document.getElementById("quantity").value = "";
        document.getElementById("unit-price").value = "";
      }

      function renderProducts() {
        const list = document.getElementById("product-list");
        const totalsum = document.getElementById("grand-total")

        list.innerHTML = "";
        let grandtotal = 0;

        products.forEach((p, index) => {
          list.innerHTML += `
                    <tr>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.qty}</td>
                        <td>${p.price}</td>
                        <td>${p.total}</td>
                        <td>
                            <button class="btn-remove" onclick="removeProduct(${index})">remove</button>
                        </td>
                    </tr>
                `;
        });
        totalsum.textContent = grandtotal.toFixed(2)
      }

      function removeProduct(index) {
        products.splice(index, 1);
        renderProducts();
      }
    </script>
  </body>
</html>
