<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karibu Statistics</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/Dashbord forms/CSS/sellersDashboard.css" />
    <link rel="stylesheet" href="/Dashbord forms/CSS/statistics.css" />
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <img src="/images/logo/karibu logo.png" alt="Karibu Logo" />
        </div>

        <ul class="nav_menu">
            <li>
                <a href="/Dashbord forms/html/managersDashboard.html" >
                    <i class="fas fa-home"></i>
                    <span>Overview</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managergosell.html" >
                    <i class="fas fa-store"></i>
                    <span>Go Sell</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managersProcurement.html">
                    <i class="fas fa-cart-plus"></i>
                    <span>Procurement</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/statistics.html" class="active">
                    <i class="fas fa-chart-bar"></i><span>Statistics</span>
                </a >
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-tags"></i>
                    <span>Pricing</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-users"></i>
                    <span>Agents</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managersProfile.html">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </li>

            <li>
                <a href="#" id="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main--content">

        <!-- HEADER -->
        <div class="header--wrapper">
            <div class="header--title">
                <span>Overview</span>
                <h2>Statistics</h2>
            </div>
            <div class="user--info">
                <div class="search--box">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" placeholder="Search" />
                </div>
                <img src="/images/logo/karibu icon.png" alt="User Icon" />
            </div>
        </div>

        <!-- STATISTICS CONTAINER -->
        <div class="stats--container">
            
            <!-- Charts Row 1 -->
            <div class="charts--wrapper">
                <div class="chart--card">
                    <h3>Monthly Sales</h3>
                    <canvas id="monthlySalesChart"></canvas>
                </div>
                
                <div class="chart--card">
                    <h3>Customer Activity</h3>
                    <canvas id="customerActivityChart"></canvas>
                </div>
            </div>

            <!-- Charts Row 2 -->
            <div class="charts--wrapper">
                <div class="chart--card full-width">
                    <h3>Yearly Overview</h3>
                    <canvas id="yearlyOverviewChart"></canvas>
                </div>
            </div>

        </div>

    </main>

    <!-- Statistics Script -->
    <script>
        // Monthly Sales Chart (Bar Chart)
        const ctx1 = document.getElementById('monthlySalesChart').getContext('2d');
        new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                datasets: [{
                    label: 'Sales (UGX)',
                    data: [1200000, 1900000, 3000000, 5000000],
                    backgroundColor: '#1B5E20'
                }]
            },
            options: { responsive: true }
        });

        // Customer Activity Chart (Pie Chart)
        const ctx2 = document.getElementById('customerActivityChart').getContext('2d');
        new Chart(ctx2, {
            type: 'pie',
            data: {
                labels: ['New', 'Returning', 'Inactive'],
                datasets: [{
                    data: [30, 50, 20],
                    backgroundColor: ['#43a047', '#1B5E20', '#aa6900']
                }]
            },
            options: { responsive: true }
        });

        // Yearly Overview (Line Chart)
        const ctx3 = document.getElementById('yearlyOverviewChart').getContext('2d');
        new Chart(ctx3, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
                datasets: [{
                    label: 'Total Revenue',
                    data: [10, 15, 12, 20, 25, 30, 35, 32, 40, 45, 50, 60], // In millions
                    borderColor: '#1B5E20',
                    fill: false,
                    tension: 0.1
                }]
            },
            options: { responsive: true }
        });
    </script>
    <script src="/Dashbord forms/JS/logout.js"></script>

</body>
</html>
