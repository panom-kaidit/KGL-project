<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGL Users profile</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/Dashbord forms/CSS/sellersDashboard.css">
    <link rel="stylesheet" href="/Dashbord forms/CSS/profile.css">

</head>
<body>
        <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <img src="/images/logo/karibu logo.png" alt="Karibu Logo" />
      </div>

      <ul class="nav_menu">
        <li>
          <a href="/Dashbord forms/html/sellersDashboard.html">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="/Dashbord forms/html/profile.html" class="active">
            <i class="fas fa-user"></i>
            <span>Profile</span>
          </a>
        </li>
        <li>
          <a href="/Dashbord forms/html/goSell.html" >
            <i class="fas fa-store"></i>
            <span>Go Sell</span>
          </a>
        </li>
        <li>
          <a href="#"><i class="fas fa-sign-out-alt"></i><span>Logout</span></a>
        </li>
      </ul>
    </div>

    <!-- The main -->
    <div class="main--content">
  <div class="header--wrapper">
    <div class="header--title">
      <span>Seller</span>
      <h2>Profile</h2>
    </div>
  </div>

  <div class="profile--container">
    <div class="profile--card">
      <img src="/images/logo/karibu icon.png" alt="Seller Photo">

      <h3>Seller Name</h3>
      <p class="role">Sales Representative</p>

      <div class="profile--info">
        <p><strong>Branch:</strong> Kampala Main Branch</p>
        <p><strong>Email:</strong> seller@karibu.com</p>
        <p><strong>Phone:</strong> +256 700 000000</p>
      </div>

      <div class="profile--bio">
        <h4>Bio</h4>
        <p>
          This seller has been working with Karibu for over 2 years and is
          responsible for daily sales and customer service.
        </p>
      </div>
    </div>
  </div>
</div>

</body>
</html>
