<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement Form</title>
    <!-- font awosome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="/Dashbord forms/CSS/procurementform.css">
    <link rel="stylesheet" href="/Dashbord forms/CSS/managersDashboard.css">
    <link rel="stylesheet" href="/Dashbord forms/CSS/sellersDashboard.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <img src="/images/logo/karibu logo.png" alt="Karibu Logo" />
        </div>

        <ul class="nav_menu">
            <li>
                <a href="/Dashbord forms/html/managersDashboard.html" >
                    <i class="fas fa-home"></i>
                    <span>Overview</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managergosell.html" >
                    <i class="fas fa-store"></i>
                    <span>Go Sell</span>
                </a>
            </li>

            <li>
                <a href="" class="active">
                    <i class="fas fa-cart-plus"></i>
                    <span>Procurement</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/statistics.html"
                    ><i class="fas fa-chart-bar"></i><span>Statistics</span>
                </a >
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-tags"></i>
                    <span>Pricing</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-users"></i>
                    <span>Agents</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managersProfile.html">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <div class="login-container">

        <!-- Header -->
        <div class="form-header">
            <img src="/images/logo/karibu icon.png" alt="Karibu Logo">
            <h1>Karibu</h1>
            <h2>Procurement Form</h2>
            <p>Please fill in the information below</p>
        </div>

        <!-- Form -->
        <form class="form-box">

            <div class="form-group">
                <label for="supplier-name">Supplier Name</label>
                <input class="input" type="text" id="supplier-name" name="supplier_name" placeholder="Supplier Name" required>
            </div>

            <div class="form-group">
                <label for="supplier-contact">Supplier Contact</label>
                <input class="input" type="tel" id="supplier-contact" name="supplier_contact" placeholder="Phone number" required>
            </div>

            <div class="form-group">
                <label for="purchase-date">Purchase Date</label>
                <input class="input" type="date" id="purchase-date" name="purchase_date" required>
            </div>

            <div class="form-group">
                <label for="invoice-number">Invoice Number</label>
                <input class="input" type="text" id="invoice-number" name="invoice_number" placeholder="Invoice No." required>
            </div>

            <div class="form-group">
                <label for="product-name">Product Name</label>
                <input class="input" type="text" id="product-name" name="product_name" placeholder="Product Name" required>
            </div>

            <div class="form-group">
                <label for="product-category">Product Category</label>
                <input class="input" type="text" id="product-category" name="product_category" placeholder="Category">
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input class="input" type="number" id="quantity" name="quantity" min="1" required>
            </div>

            <div class="form-group">
                <label for="unit-price">Unit Price</label>
                <input class="input" type="number" id="unit-price" name="unit_price" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="total-amount">Total Amount</label>
                <input class="input" type="text" id="total-amount" name="total_amount" placeholder="Auto / Manual">
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <div class="remember">
                    <label><input type="radio" name="payment"> Cash</label>
                    <label><input type="radio" name="payment"> Mobile Money</label>
                    <label><input type="radio" name="payment"> Card</label>
                </div>
            </div>

            <!-- Payment Status -->
            <div class="form-group">
                <label>Payment Status</label>
                <div class="remember">
                    <label>
                        <input type="radio" name="payment_status" value="paid"> Paid
                    </label>
                    <label>
                        <input type="radio" name="payment_status" value="pending"> Pending
                    </label>
                    <label>
                        <input type="radio" name="payment_status" value="partial"> Partial
                    </label>
                </div>
            </div>

            <!-- Submit -->
            <div class="submit-btn">
                <button type="submit">Submit Procurement</button>
            </div>

        </form>
    </div>

</body>
</html>
