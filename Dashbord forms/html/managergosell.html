<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KGL Manager Dashboard</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="/Dashbord forms/CSS/managersDashboard.css" />
    <link rel="stylesheet" href="/Dashbord forms/CSS/goSell.css" />
    <link rel="stylesheet" href="/Dashbord forms/CSS/sellersDashboard.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">
            <img src="/images/logo/karibu logo.png" alt="Karibu Logo" />
        </div>

        <ul class="nav_menu">
            <li>
                <a href="/Dashbord forms/html/managersDashboard.html" >
                    <i class="fas fa-home"></i>
                    <span>Overview</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managergosell.html" class="active">
                    <i class="fas fa-store"></i>
                    <span>Go Sell</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managersProcurement.html">
                    <i class="fas fa-cart-plus"></i>
                    <span>Procurement</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/statistics.html"
                    ><i class="fas fa-chart-bar"></i><span>Statistics</span>
                </a >
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-tags"></i>
                    <span>Pricing</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-users"></i>
                    <span>Agents</span>
                </a>
            </li>

            <li>
                <a href="/Dashbord forms/html/managersProfile.html">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main--content">

        <!-- HEADER -->
        <div class="header--wrapper">
            <div class="header--title">
                <span>Sales Dashboard</span>
                <h2>Go Sell</h2>
            </div>
        </div>

        <!-- SELL CONTAINER -->
        <section class="sell--container">
            <h3 class="main--title">Available Products</h3>

            <div class="product--grid">

                <div class="product--card">
                    <h4>Maize</h4>
                    <p>UGX 2,500 / Kg</p>
                    <a href="/Dashbord forms/html/salesform.html">
                        <button>Select</button>
                    </a>
                </div>

                <div class="product--card">
                    <h4>Beans</h4>
                    <p>UGX 3,000 / Kg</p>
                    <a href="/Dashbord forms/html/salesform.html">
                        <button>Select</button>
                    </a>
                </div>

                <div class="product--card">
                    <h4>Rice</h4>
                    <p>UGX 4,500 / Kg</p>
                    <a href="/Dashbord forms/html/salesform.html">
                        <button>Select</button>
                    </a>
                </div>

                <div class="product--card">
                    <h4>Soya</h4>
                    <p>UGX 3,800 / Kg</p>
                    <a href="/Dashbord forms/html/salesform.html">
                        <button>Select</button>
                    </a>
                </div>

            </div>
        </section>

    </main>

</body>
</html>
